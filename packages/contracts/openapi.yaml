openapi: 3.1.0
info:
  title: Checkdrop API
  version: 0.1.0-dev.0
  description: Czech-first, explainable customer-data validation.
  license:
    name: Proprietary pre-release
servers:
  - url: https://api.checkdrop.dev
    description: Hosted Checkdrop service; only health and explicitly published operations are exposed.
  - url: "{origin}"
    description: Self-hosted Checkdrop installation.
    variables:
      origin:
        default: https://checks.example.com
        description: Public origin of the installation (CHECKDROP_PUBLIC_API_URL).
  - url: http://localhost:8787
    description: Local Node.js server
tags:
  - name: System
  - name: Validation
  - name: Shadow
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        "200":
          description: Server is accepting requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /v1/capabilities:
    get:
      operationId: listCapabilities
      tags: [System]
      security: []
      responses:
        "200":
          description: Capability and maturity list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /v1/embed.js:
    get:
      operationId: getHostedFormScript
      tags: [Hosted integration]
      security: []
      responses:
        "200":
          description: Domain-bound hosted browser integration loaded with one script tag. Per-field e-mail assistance changes a value only after an explicit customer click.
          content:
            application/javascript:
              schema: { type: string }
  /v1/names/validate:
    post:
      operationId: validateName
      tags: [Validation]
      x-checkdrop-availability: implemented-pilot
      x-checkdrop-shadow: implemented-pilot
      x-checkdrop-issues:
        - person.full_name_missing
        - person.full_name_incomplete
        - person.company_name_in_contact
        - person.whitespace_normalized
        - person.trailing_punctuation
        - person.title_normalized
        - person.capitalization_normalized
        - person.initial_spacing_normalized
        - person.capitalization_ambiguous
        - person.invalid_characters
        - person.separator_invalid
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientName"
        - $ref: "#/components/parameters/IntegrationMode"
        - $ref: "#/components/parameters/ObservationMode"
        - $ref: "#/components/parameters/FormId"
        - $ref: "#/components/parameters/CheckoutSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name]
              properties:
                full_name: { type: string, maxLength: 240 }
                customer_type: { type: string, enum: [private, company], default: private }
                context: { type: string, enum: [billing, shipping], default: billing }
                policy: { $ref: "#/components/schemas/ValidationPolicy" }
      responses:
        "200":
          description: Kontrola společného pole jméno a příjmení včetně bezpečné normalizace mezer, titulů a velikosti písmen
          headers:
            Server-Timing:
              description: Server-side validation duration in milliseconds.
              schema: { type: string, example: "checkdrop;dur=2" }
            X-Checkdrop-Observation:
              description: Result of optional masked preview storage.
              schema: { type: string, enum: [stored, duplicate, unavailable] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/integration/config:
    get:
      operationId: getIntegrationConfig
      tags: [Hosted integration]
      x-checkdrop-availability: implemented-pilot
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - name: path
          in: query
          required: false
          description: Browser pathname used to select the configured form profile. Query strings and fragments are never sent.
          schema: { type: string, minLength: 1, maxLength: 1024, pattern: "^/" }
      responses:
        "200":
          description: Versioned selector and validation mapping linked to the supplied API key. `suggest` is limited to e-mail and Czech phone normalization with a `blur` trigger and requires explicit customer confirmation in the hosted script.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [object, request_id, integration_id, client_name, environment, state, config_version, form, fields, forms]
                properties:
                  object: { type: string, const: integration_config }
                  request_id: { type: string }
                  integration_id: { type: string }
                  client_name: { type: string }
                  environment: { type: string, enum: [test, live] }
                  state: { type: string, enum: [draft, scanned, configured, shadow, paused, unmatched] }
                  config_version: { type: integer, minimum: 1 }
                  features:
                    description: Optional server capabilities. A missing flag means false; older clients ignore it.
                    type: object
                    additionalProperties: false
                    properties:
                      address_components: { type: boolean }
                  form:
                    oneOf:
                      - type: "null"
                      - type: object
                        additionalProperties: false
                        required: [id, name, path_pattern, match_mode, root_selector]
                        properties:
                          id: { type: string }
                          name: { type: string }
                          path_pattern: { type: string, pattern: "^/" }
                          match_mode: { type: string, enum: [exact, prefix] }
                          root_selector: { type: string, minLength: 1, maxLength: 512 }
                  fields:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [selector, canonical_field, context, condition_key, required, validation_mode, validation_trigger]
                      properties:
                        selector: { type: string }
                        canonical_field: { type: string }
                        context: { type: string }
                        condition_key: { type: [string, "null"] }
                        required: { type: boolean }
                        validation_mode: { type: string, enum: [off, shadow, suggest] }
                        validation_trigger: { type: string, enum: [input, blur, submit] }
                        require_complete_name: { type: boolean, default: false, description: "Optional local JavaScript submission guard for personal names. Requires the hosted script and configuration to load; not server-side enforcement." }
                        submit_selector: { type: [string, 'null'], maxLength: 512, description: "Final action CSS selector for AJAX forms or forms with multiple submit buttons." }
                  forms:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, path_pattern, match_mode, root_selector, config_version, fields]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        path_pattern: { type: string, pattern: "^/" }
                        match_mode: { type: string, enum: [exact, prefix] }
                        root_selector: { type: string, minLength: 1, maxLength: 512 }
                        config_version: { type: integer, minimum: 1 }
                        fields:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [selector, canonical_field, context, condition_key, required, validation_mode, validation_trigger]
                            properties:
                              selector: { type: string }
                              canonical_field:
                                type: string
                                enum: [customer_type, full_name, first_name, last_name, email, phone, street_line, city, postal_code, country, company_id, company_name, vat_id, profile_details_enabled, alternate_shipping_enabled, unmapped]
                              context: { type: string, enum: [billing, shipping, company, shared] }
                              condition_key: { type: [string, "null"] }
                              required: { type: boolean }
                              validation_mode: { type: string, enum: [off, shadow, suggest] }
                              validation_trigger: { type: string, enum: [input, blur, submit] }
                              require_complete_name: { type: boolean, default: false }
                              submit_selector: { type: [string, 'null'], maxLength: 512 }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/emails/validate:
    post:
      operationId: validateEmail
      tags: [Validation]
      x-checkdrop-availability: implemented-milestone-1
      x-checkdrop-shadow: implemented-milestone-2
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientName"
        - $ref: "#/components/parameters/IntegrationMode"
        - $ref: "#/components/parameters/ObservationMode"
        - $ref: "#/components/parameters/FormId"
        - $ref: "#/components/parameters/CheckoutSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 3, maxLength: 320 }
                policy: { $ref: "#/components/schemas/ValidationPolicy" }
      responses:
        "200":
          description: Explainable email result
          headers:
            Server-Timing:
              description: Server-side validation duration in milliseconds.
              schema: { type: string, example: "checkdrop;dur=12" }
            X-Checkdrop-Observation:
              description: Result of optional masked preview storage.
              schema: { type: string, enum: [stored, duplicate, unavailable] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/assist/interactions:
    post:
      operationId: recordAssistInteraction
      tags: [Hosted integration]
      x-checkdrop-availability: implemented-pilot
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/FormId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, event]
              properties:
                request_id: { type: string, format: uuid }
                event: { type: string, enum: [shown, applied, kept, undone] }
                proposed_value:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Selected structured address label or confirmed company name; accepted only with event `applied`.
                changed_fields:
                  type: array
                  maxItems: 16
                  uniqueItems: true
                  items:
                    type: string
                    enum: [first_name, last_name, full_name, company_name, company_id, vat_id, street_line, city, postal_code, country]
      responses:
        "204":
          description: Interaction was accepted without exposing whether the referenced observation exists.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/phones/validate:
    post:
      operationId: validatePhone
      tags: [Validation]
      x-checkdrop-availability: implemented-milestone-1
      x-checkdrop-shadow: implemented-milestone-2
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientName"
        - $ref: "#/components/parameters/IntegrationMode"
        - $ref: "#/components/parameters/ObservationMode"
        - $ref: "#/components/parameters/FormId"
        - $ref: "#/components/parameters/CheckoutSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, minLength: 3, maxLength: 64 }
                country: { type: string, const: CZ }
      responses:
        "200":
          description: Explainable phone result
          headers:
            Server-Timing:
              description: Server-side validation duration in milliseconds.
              schema: { type: string, example: "checkdrop;dur=4" }
            X-Checkdrop-Observation:
              description: Result of optional masked preview storage.
              schema: { type: string, enum: [stored, duplicate, unavailable] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/addresses/validate:
    post:
      operationId: validateAddress
      tags: [Validation]
      x-checkdrop-availability: implemented-pilot
      x-checkdrop-shadow: implemented-milestone-2
      x-checkdrop-issues:
        - person.first_name_missing
        - person.last_name_missing
        - address.country_mismatch
        - address.ruian_normalized
        - address.ruian_ambiguous
        - address.ruian_not_found
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientName"
        - $ref: "#/components/parameters/IntegrationMode"
        - $ref: "#/components/parameters/ObservationMode"
        - $ref: "#/components/parameters/FormId"
        - $ref: "#/components/parameters/CheckoutSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [first_name, last_name, address, country]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                address: { type: string, minLength: 3, maxLength: 512 }
                city: { type: string, minLength: 1, maxLength: 160 }
                postal_code: { type: string, pattern: "^[0-9]{3} ?[0-9]{2}$" }
                country: { type: string, const: CZ }
      responses:
        "200":
          description: >-
            Delivery-contact completeness and Czech address result backed by the local RÚIAN
            snapshot, including declared-country consistency
          headers:
            Server-Timing:
              description: Server-side validation duration in milliseconds.
              schema: { type: string, example: "checkdrop;dur=8" }
            X-Checkdrop-Observation:
              description: Result of optional masked preview storage.
              schema: { type: string, enum: [stored, duplicate, unavailable] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/addresses/autocomplete:
    post:
      operationId: autocompleteCzechAddress
      tags: [Validation]
      x-checkdrop-availability: implemented-pilot
      x-checkdrop-surface: public-pilot
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientName"
        - $ref: "#/components/parameters/IntegrationMode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 256 }
                country: { type: string, const: CZ, default: CZ }
                limit: { type: integer, minimum: 1, maximum: 10, default: 6 }
                components:
                  description: Optional separate checkout fields. When present, `query` must equal the trimmed non-empty fields joined by one space and cut to 256 characters, the PSČ is read only from `postal_code`, and the response may carry `advice`. Clients send it only when the integration config announces `features.address_components`.
                  type: object
                  additionalProperties: false
                  required: [street_line, city, postal_code]
                  properties:
                    street_line: { type: string, maxLength: 200 }
                    city: { type: string, maxLength: 80 }
                    postal_code: { type: string, maxLength: 10 }
      responses:
        "200":
          description: Czech address suggestions from the active local RÚIAN snapshot
          headers:
            Server-Timing:
              description: Server-side autocomplete duration in milliseconds.
              schema: { type: string, example: "checkdrop;dur=7" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressSuggestionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/companies/autocomplete:
    post:
      operationId: autocompleteCzechCompany
      tags: [Validation]
      x-checkdrop-availability: implemented-pilot
      x-checkdrop-surface: public-pilot
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/ClientName"
        - $ref: "#/components/parameters/IntegrationMode"
        - $ref: "#/components/parameters/FormId"
        - $ref: "#/components/parameters/CheckoutSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 128 }
                country: { type: string, const: CZ, default: CZ }
                limit: { type: integer, minimum: 1, maximum: 5, default: 5 }
      responses:
        "200":
          description: Nejvýše pět českých firem z ARES. Částečné IČO se dohledává pouze v krátké serverové cache; ARES podporuje globálně jen přesné osmimístné IČO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySuggestionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/company-ids/validate:
    post:
      operationId: validateCompanyId
      tags: [Validation]
      x-checkdrop-availability: implemented-pilot
      x-checkdrop-shadow: implemented-milestone-2
      security: [{ ApiKey: [] }, { SiteKey: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientName"
        - $ref: "#/components/parameters/IntegrationMode"
        - $ref: "#/components/parameters/ObservationMode"
        - $ref: "#/components/parameters/FormId"
        - $ref: "#/components/parameters/CheckoutSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [company_id]
              properties:
                company_id: { type: string, minLength: 1, maxLength: 32 }
                country: { type: string, const: CZ }
      responses:
        "200":
          description: Explainable Czech company ID result backed by ARES
          headers:
            Server-Timing:
              description: Server-side validation duration in milliseconds.
              schema: { type: string, example: "checkdrop;dur=120" }
            X-Checkdrop-Observation:
              description: Result of optional masked preview storage.
              schema: { type: string, enum: [stored, duplicate, unavailable] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/operator/observations:
    servers:
      - url: https://app.checkdrop.dev/checkdrop
        description: Cloudflare Access-protected operator proxy.
    get:
      operationId: listShadowObservations
      tags: [Shadow]
      x-checkdrop-availability: implemented-pilot
      security: [{ OperatorKey: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: page_size
          in: query
          description: Number of customer cases per page. Every selected case includes all of its field observations.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: filter
          in: query
          description: Filters the server-side result page; detailed filters also scope summary metrics.
          schema: { type: string, enum: [all, changed, review], default: all }
        - name: operation
          in: query
          schema: { type: string, enum: [name.validate, email.validate, phone.validate, address.validate, company_id.validate] }
        - name: result
          in: query
          schema: { $ref: "#/components/schemas/ValidationStatus" }
        - name: assist_outcome
          in: query
          schema: { type: string, enum: [shown_only, applied, kept, undone, none] }
        - name: form_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: session_ref
          in: query
          description: Irreversible server HMAC used to group validations from one browser checkout session.
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Unexpired encrypted shadow observations paged by customer case. Filters select matching cases; the response keeps all related fields together inside each selected case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowObservationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/operator/observations/search:
    servers:
      - url: https://app.checkdrop.dev/checkdrop
        description: Cloudflare Access-protected operator proxy.
    post:
      operationId: searchShadowObservations
      tags: [Shadow]
      x-checkdrop-availability: implemented-pilot
      description: Searches encrypted customer cases through a key-derived blind index. The customer query stays in the request body and is not included in URL logs.
      security: [{ OperatorKey: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: filter
          in: query
          schema: { type: string, enum: [all, changed, review], default: all }
        - name: operation
          in: query
          schema: { type: string, enum: [name.validate, email.validate, phone.validate, address.validate, company_id.validate] }
        - name: result
          in: query
          schema: { $ref: "#/components/schemas/ValidationStatus" }
        - name: assist_outcome
          in: query
          schema: { type: string, enum: [shown_only, applied, kept, undone, none] }
        - name: form_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 2
                  maxLength: 120
                  description: Name, company, e-mail, phone, company ID, or visible case ID prefix.
      responses:
        "200":
          description: Matching customer cases with all related field observations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowObservationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client operation identifier. Only a key-scoped HMAC bound to the operation and request is stored.
      schema: { type: string, minLength: 1, maxLength: 128 }
    ClientName:
      name: X-Checkdrop-Client
      in: header
      required: false
      description: Redacted SDK or integration identifier stored with usage measurements.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^(?=.*[A-Za-z])[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$"
    IntegrationMode:
      name: X-Checkdrop-Mode
      in: header
      required: false
      description: Marks measurement-only shadow traffic. Requires X-Checkdrop-Client.
      schema: { type: string, const: shadow }
    ObservationMode:
      name: X-Checkdrop-Observe
      in: header
      required: false
      description: Server-controlled opt-in to an encrypted observation retained for at most 90 days. Requires shadow mode; browsers must not set this header directly.
      schema: { type: string, const: preview }
    FormId:
      name: form
      in: query
      required: false
      description: Hosted-script form profile selected from the current pathname. The API verifies that it belongs to the authenticated website.
      schema: { type: string, minLength: 1, maxLength: 120 }
    CheckoutSession:
      name: session
      in: query
      required: false
      description: Hosted script UUID used only to derive an irreversible server-side grouping reference. The raw UUID is not stored.
      schema: { type: string, format: uuid, pattern: "^[a-fA-F0-9]{8}-[a-fA-F0-9]{4}-4[a-fA-F0-9]{3}-[89aAbB][a-fA-F0-9]{3}-[a-fA-F0-9]{12}$" }
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Checkdrop-Key
    SiteKey:
      type: apiKey
      in: query
      name: site
      description: Public hosted-script identifier restricted to the configured form origin and validation routes. It cannot access imports, observations, or operator APIs.
    OperatorKey:
      type: apiKey
      in: header
      name: X-Checkdrop-Operator-Key
      description: Server-held credential used only by the Access-protected operator proxy.
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [object, status, service, request_id, version, release]
      properties:
        object: { const: health_status }
        status: { const: ok }
        service: { type: string }
        request_id: { type: string }
        version: { type: string }
        release: { type: [string, "null"] }
    ValidationPolicy:
      type: string
      enum: [assist, standard, strict]
    ValidationStatus:
      type: string
      enum: [valid, correctable, risky, invalid, unknown]
    RecommendedAction:
      type: string
      enum: [accept, normalize, suggest, warn, block, defer, fail_open]
    Issue:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string }
    Evidence:
      type: object
      additionalProperties: false
      required: [source, checked_at, state]
      properties:
        source: { type: string }
        checked_at: { type: string, format: date-time }
        state: { type: string, enum: [confirmed, absent, unavailable, stale, not_applicable] }
        detail: { type: string }
    ValidationResult:
      type: object
      additionalProperties: false
      required: [id, object, request_id, status, action, normalized, suggestion, issues, evidence]
      properties:
        id: { type: string }
        object: { const: validation_result }
        request_id: { type: string }
        status: { $ref: "#/components/schemas/ValidationStatus" }
        action: { $ref: "#/components/schemas/RecommendedAction" }
        normalized: { type: [string, "null"] }
        suggestion: { type: [string, "null"] }
        company:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/Company" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
    CompanySuggestionList:
      type: object
      additionalProperties: false
      required: [object, request_id, status, country, suggestions, evidence]
      properties:
        object: { const: company_suggestion_list }
        request_id: { type: string, format: uuid }
        status: { type: string, enum: [matched, no_match, unavailable] }
        country: { type: string, const: CZ }
        suggestions:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Company" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
    Company:
      type: object
      additionalProperties: false
      required: [ico, name, vat_id, address, address_standardized, updated_at, primary_source, registered_office]
      properties:
        ico: { type: string, pattern: "^[0-9]{8}$" }
        name: { type: string, minLength: 1, maxLength: 512 }
        vat_id: { type: [string, "null"], maxLength: 32 }
        address: { type: [string, "null"], maxLength: 1024 }
        address_standardized: { type: [boolean, "null"] }
        updated_at: { type: [string, "null"] }
        primary_source: { type: [string, "null"] }
        registered_office:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [street_line, city, postal_code, country]
              properties:
                street_line: { type: [string, "null"] }
                city: { type: [string, "null"] }
                postal_code: { type: [string, "null"], pattern: "^[0-9]{5}$" }
                country: { type: string, const: CZ }
    AddressSuggestionList:
      type: object
      additionalProperties: false
      required: [object, request_id, status, country, suggestions, evidence]
      properties:
        object: { const: address_suggestion_list }
        request_id: { type: string, format: uuid }
        status: { type: string, enum: [matched, no_match, unavailable] }
        country: { type: string, const: CZ }
        suggestions:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AddressSuggestion" }
        advice:
          description: Only for requests with `components`. `postal_code_mismatch` means the street or village, house number, orientation number if typed and municipality match exactly one address point with another PSČ; the address is then the only suggestion.
          oneOf:
            - type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, enum: [address.house_number_missing, address.no_match] }
            - type: object
              additionalProperties: false
              required: [code, postal_code]
              properties:
                code: { type: string, const: address.postal_code_mismatch }
                postal_code: { type: string, pattern: "^[0-9]{5}$" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
    AddressSuggestion:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - street_line
        - street
        - house_number
        - orientation_number
        - city
        - city_part
        - postal_code
      properties:
        id: { type: string, description: RÚIAN address-place identifier. }
        label: { type: string }
        street_line: { type: string }
        street: { type: [string, "null"] }
        house_number: { type: string }
        orientation_number: { type: [string, "null"] }
        city: { type: string }
        city_part: { type: [string, "null"] }
        postal_code: { type: string, pattern: "^[0-9]{5}$" }
    ShadowObservationList:
      type: object
      additionalProperties: false
      required: [object, request_id, data, summary, pagination]
      properties:
        object: { const: shadow_observation_list }
        request_id: { type: string, format: uuid }
        data:
          type: array
          items: { $ref: "#/components/schemas/ShadowObservation" }
        summary: { $ref: "#/components/schemas/ShadowObservationSummary" }
        pagination:
          allOf: [{ $ref: "#/components/schemas/Pagination" }]
          description: Page size and total count refer to customer cases, not individual field observations.
    ShadowObservation:
      type: object
      additionalProperties: false
      required:
        - id
        - request_id
        - operation
        - client_name
        - form_id
        - form_name
        - checkout_session_ref
        - input_value
        - proposed_value
        - value_visibility
        - input_preview
        - proposed_preview
        - changed
        - status
        - action
        - issue_codes
        - evidence_sources
        - server_latency_ms
        - assist_shown_at
        - assist_outcome
        - assist_outcome_at
        - assist_changed_fields
        - observed_at
        - expires_at
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        operation:
          {
            type: string,
            enum: [name.validate, email.validate, phone.validate, address.validate, company_id.validate],
          }
        client_name: { type: string, minLength: 1, maxLength: 64 }
        form_id: { type: [string, "null"] }
        form_name: { type: [string, "null"] }
        checkout_session_ref:
          {
            type: [string, "null"],
            pattern: "^[a-f0-9]{64}$",
            description: Irreversible grouping reference for one checkout session.,
          }
        input_value:
          {
            type: string,
            minLength: 1,
            maxLength: 8192,
            description: Full value available only from the protected operator API for up to 90 days.,
          }
        proposed_value: { type: [string, "null"], minLength: 1, maxLength: 8192 }
        value_visibility: { type: string, enum: [full, masked_legacy] }
        input_preview: { type: string, minLength: 1, maxLength: 160 }
        proposed_preview: { type: [string, "null"], minLength: 1, maxLength: 160 }
        changed: { type: boolean }
        status: { $ref: "#/components/schemas/ValidationStatus" }
        action: { $ref: "#/components/schemas/RecommendedAction" }
        issue_codes:
          type: array
          maxItems: 32
          items: { type: string }
        evidence_sources:
          type: array
          maxItems: 16
          items: { type: string }
        server_latency_ms: { type: integer, minimum: 0, maximum: 300000 }
        assist_shown_at: { type: [string, "null"], format: date-time }
        assist_outcome: { type: [string, "null"], enum: [applied, kept, undone, null] }
        assist_outcome_at: { type: [string, "null"], format: date-time }
        assist_changed_fields:
          type: array
          maxItems: 16
          items:
            type: string
            enum: [first_name, last_name, full_name, company_name, company_id, vat_id, street_line, city, postal_code, country]
        observed_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ShadowObservationSummary:
      type: object
      additionalProperties: false
      required: [total, proposed_changes, review_required, average_server_latency_ms, p95_server_latency_ms, assist_shown, assist_applied, assist_kept, assist_undone]
      properties:
        total: { type: integer, minimum: 0 }
        proposed_changes: { type: integer, minimum: 0 }
        review_required: { type: integer, minimum: 0 }
        average_server_latency_ms: { type: number, minimum: 0 }
        p95_server_latency_ms: { type: number, minimum: 0 }
        assist_shown: { type: integer, minimum: 0 }
        assist_applied: { type: integer, minimum: 0 }
        assist_kept: { type: integer, minimum: 0 }
        assist_undone: { type: integer, minimum: 0 }
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total, pages]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 1 }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        request_id: { type: string }
