name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm audit --prod --audit-level high
      - name: Installation files
        run: |
          bash -n checkdrop install.sh
          printf 'CHECKDROP_VERSION=0.0.0\nCHECKDROP_POSTGRES_PASSWORD=x\nCHECKDROP_PUBLIC_URL=http://localhost:8080\nCHECKDROP_OPERATOR_TOKEN=x\nCHECKDROP_PILOT_API_KEY=x\nCHECKDROP_EMBED_SIGNING_SECRET=x\nCHECKDROP_OBSERVATION_ENCRYPTION_KEY=x\nCHECKDROP_SITE_ADDRESS=http://localhost\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f compose.yaml -f compose.build.yaml config --quiet
          for mode in password external; do
            docker run --rm -v "$PWD/infra/web/Caddyfile:/etc/caddy/Caddyfile:ro" -e CHECKDROP_ADMIN_AUTH=$mode \
              caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
          done
